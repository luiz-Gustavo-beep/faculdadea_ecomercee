
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos | Ribeiro Automóveis</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/veiculos.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/logo-principal.png" alt="Ribeiro Automóveis">
        </div>
        <nav>
            <a href="index.html#inicio">Início</a>
            <a href="veiculos.html">Veículos</a>
            <a href="index.html#contato">Contato</a>
        </nav>
    </header>

    <main>
        <section id="catalogo">
            <p class="subtitulo">ENCONTRE SEU PRÓXIMO CARRO</p>
            <h2>Nossos veículos</h2>
            <p>Confira os veículos disponíveis na Ribeiro Automóveis.</p>
            <p id="estado-catalogo" role="status" aria-live="polite">
                Carregando veículos...
            </p>
            <div class="lista-veiculos" id="lista-veiculos"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ribeiro Automóveis</p>
    </footer>

    <script>
        const listaVeiculos = document.getElementById("lista-veiculos");
        const estadoCatalogo = document.getElementById("estado-catalogo");

        async function carregarVeiculos() {
            estadoCatalogo.textContent = "Carregando veículos...";
            listaVeiculos.replaceChildren();

            try {
                const [respostaVeiculos, respostaImagens] = await Promise.all([
                    fetch("/veiculos"),
                    fetch("/imagens")
                ]);

                if (!respostaVeiculos.ok) {
                    throw new Error("Não foi possível carregar os veículos.");
                }

                const veiculos = await respostaVeiculos.json();

                let imagens = [];
                if (respostaImagens.ok) {
                    imagens = await respostaImagens.json();
                }

                if (!Array.isArray(veiculos) || veiculos.length === 0) {
                    estadoCatalogo.textContent =
                        "No momento, não temos veículos disponíveis.";
                    return;
                }

                veiculos.forEach(veiculo => {
                    const cartao = document.createElement("article");
                    cartao.className = "card-veiculo";

                    const areaImagem = document.createElement("div");
                    areaImagem.className = "imagem-veiculo";

                    const imagemVeiculo = imagens.find(imagem =>
                        imagem.veiculo &&
                        Number(imagem.veiculo.id) === Number(veiculo.id)
                    );

                    if (imagemVeiculo && imagemVeiculo.url) {
                        const foto = document.createElement("img");
                        foto.src = imagemVeiculo.url;
                        foto.alt = `${veiculo.marca} ${veiculo.modelo}`;
                        foto.loading = "lazy";
                        foto.style.width = "100%";
                        foto.style.height = "100%";
                        foto.style.objectFit = "cover";

                        foto.addEventListener("error", () => {
                            areaImagem.replaceChildren();
                            areaImagem.textContent = "Foto indisponível";
                        });

                        areaImagem.appendChild(foto);
                    } else {
                        areaImagem.textContent = "Foto do veículo";
                    }

                    const informacoes = document.createElement("div");
                    informacoes.className = "info-veiculo";

                    const titulo = document.createElement("h3");
                    titulo.textContent =
                        `${veiculo.marca ?? ""} ${veiculo.modelo ?? ""}`.trim();

                    const ano = document.createElement("p");
                    ano.className = "ano-veiculo";
                    ano.textContent = veiculo.ano ?? "Ano não informado";

                    const preco = document.createElement("p");
                    preco.className = "preco-veiculo";
                    preco.textContent =
                        veiculo.preco !== null && veiculo.preco !== undefined
                            ? Number(veiculo.preco).toLocaleString("pt-BR", {
                                style: "currency",
                                currency: "BRL"
                            })
                            : "Consulte o preço";

                    const descricao = document.createElement("p");
                    descricao.className = "descricao-veiculo";
                    descricao.textContent = veiculo.descricao ?? "";

                    const botao = document.createElement("a");
                    botao.href = "index.html#contato";
                    botao.className = "botao-veiculo";
                    botao.textContent = "Tenho interesse";

                    informacoes.append(titulo, ano, preco, descricao, botao);
                    cartao.append(areaImagem, informacoes);
                    listaVeiculos.appendChild(cartao);
                });

                estadoCatalogo.textContent =
                    `${veiculos.length} veículo(s) disponível(is).`;

            } catch (erro) {
                console.error("Erro ao carregar catálogo:", erro);
                estadoCatalogo.textContent =
                    "Não foi possível carregar os veículos. Tente novamente mais tarde.";
            }
        }

        carregarVeiculos();
    </script>
</body>
</html>
